packages:
  - packages/*
  - validators/*
  - indexer
  - web
  - scripts

# esbuild (the indexer's envio -> tsx) ships its binary as a platform package; its install script is not run.
allowBuilds:
  esbuild: false

# Shared dependency versions; packages reference them as "catalog:".
catalog:
  "@types/node": ^22.20.0
  typescript: ^7.0.2
  viem: ^2.57.2
  vitest: ^5.0.3
  zod: ^4.6.5
