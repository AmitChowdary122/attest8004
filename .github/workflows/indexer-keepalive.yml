name: Indexer keep-alive

# Keeps the hosted Envio indexer alive through judging and fails loudly when it is gone or behind (plan P8,
# addition 1). Envio's free plan deletes a deployment after 7 days without a query; this queries it daily. It can't
# extend the 30-day lifetime: docs/deployments.md says when it expires and how to redeploy.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: indexer-keepalive
  cancel-in-progress: false

jobs:
  ping:
    name: Query the hosted indexer
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: One GraphQL query to DEPLOYMENTS[10143].trustApi.graphqlUrl; fail if it is gone or more than a day behind
        # No install and no secrets: the script uses fetch and reads the SDK's deployments file by path.
        run: node scripts/src/indexer-keepalive.ts
