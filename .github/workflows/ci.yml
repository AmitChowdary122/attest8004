name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Contracts (forge test)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.8.4

      - name: Check formatting
        run: forge fmt --check

      - name: Build
        run: forge build --sizes

      - name: Check hash vectors against cast
        # The independent oracle for SPEC §4.3: recomputes every expected hash in
        # packages/sdk/test/vectors.json with cast (jq is preinstalled on the runner).
        run: ../packages/sdk/test/vectors.sh --check

      - name: Check passkey vectors against cast
        # The independent oracle for MandateRegistry v2's challenge, change hashes, selectors and
        # topics (SPEC §4.2): recomputes packages/sdk/test/passkey-vectors.json with cast and sha256sum.
        run: ../packages/sdk/test/passkey-vectors.sh --check

      - name: Test (unit + fuzz)
        run: forge test -vvv --no-match-path 'test/fork/*'
        env:
          FOUNDRY_PROFILE: ci

  contracts-fork:
    name: Contracts (fork tests vs Monad testnet)
    runs-on: ubuntu-latest
    # Uses the public Monad testnet RPC; a rate limit there must not turn main red.
    continue-on-error: true
    permissions:
      contents: read
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.8.4

      - name: Fork tests against the canonical testnet Identity Registry
        run: forge test -vvv --match-path 'test/fork/*'
        env:
          # Public endpoint, not a secret.
          MONAD_TESTNET_RPC_URL: https://testnet-rpc.monad.xyz

  secrets:
    name: Secrets (gitleaks, full history)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install gitleaks v8.30.1 (checksum-pinned)
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm gitleaks gitleaks.tar.gz

      - name: Scan every commit on every ref
        # Uses the repo's .gitleaks.toml (default rules + the EVM private-key rule).
        run: gitleaks git --redact --no-banner --verbose --log-opts="--all" .

  typescript:
    name: TypeScript (pnpm test)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm (version from packageManager)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check inbox envelope vectors against node:crypto
        # The independent oracle for the findings envelope (ARCHITECTURE §6): recomputes
        # packages/sdk/test/inbox-vectors.json with node:crypto (X25519, HKDF-SHA256, AES-256-GCM).
        run: node packages/sdk/test/make-inbox-vectors.ts --check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build the web app (what Vercel deploys)
        run: pnpm --filter @attest8004/web build

  cre:
    name: CRE workflow (validator C, bun test)
    runs-on: ubuntu-latest
    # cre/ is a Bun project outside the pnpm workspace. CI can't log in to CRE, so it can't simulate; it checks the
    # workflow's pure logic, its handler against the SDK's test mocks, its types and its WASM build.
    permissions:
      contents: read
    defaults:
      run:
        working-directory: cre/validator-c
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm (version from packageManager)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install the workspace (the workflow imports packages/sdk/src, whose viem and zod resolve from here)
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Install Bun (cre/mise.toml pins 1.3.14)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install the workflow's dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun test

      - name: Typecheck (the WASM program with types [], and the tests)
        run: bun run typecheck

      - name: Compile the workflow to WASM (what cre workflow simulate runs)
        run: bun run compile
