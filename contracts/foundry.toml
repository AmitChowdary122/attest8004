[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
# Monad: P256VERIFY precompile at 0x0100, Monad gas semantics.
network = "monad"
solc_version = "0.8.37"
# Osaka opcodes (e.g. CLZ) verified live on Monad testnet and mainnet on 2 Oct 2026.
evm_version = "osaka"
optimizer = true
optimizer_runs = 200
# The shared requestHash vectors (SPEC §4.3) live with the SDK; test/ActionHash.t.sol reads them.
fs_permissions = [
    { access = "read", path = "../packages/sdk/test/vectors.json" },
    # test/MandateRegistry.t.sol reads the passkey challenge vectors (SPEC §4.2).
    { access = "read", path = "../packages/sdk/test/passkey-vectors.json" },
    # test/AgentRequestForwarder.t.sol pins the forwarder's compiled ABI.
    { access = "read", path = "./out" },
]
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

[profile.default.fuzz]
runs = 1000

[profile.ci.fuzz]
runs = 10000

[rpc_endpoints]
monad_testnet = "${MONAD_TESTNET_RPC_URL}"
monad = "${MONAD_RPC_URL}"

# See https://getfoundry.sh/config/reference/ for all options.
